[package]
name = "compio_resolve"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0/rust.git"
homepage = "https://github.com/js0/rust/tree/main/compio_resolve"
description = "A DNS resolver for compio, using cache and system configuration for zero-cost async resolution. / compio 的异步 DNS 解析器，支持缓存和系统配置。"
keywords = ["async", "dns", "resolver", "cache", "compio"]
categories = ["network-programming", "asynchronous", "caching"]
readme = "README.md"

[features]
default = ["cache"]
cache = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
scc = "2"
compio-net = { path = "../../fork/compio/compio-net", features = [
  "extern_resolve",
] }
compio-buf = { path = "../../fork/compio/compio-buf" }
compio-io = { path = "../../fork/compio/compio-io" }
compio-runtime = { path = "../../fork/compio/compio-runtime", features = [
  "event",
  "time",
] }
fastrand = "2.3"
futures-util = "0.3"
logos = "0.16"
once_cell = "1"
zerocopy = { version = "0.8", features = ["derive"] }

[dev-dependencies]
aok = "0.1.18"
log = "0.4.29"
log_init = "0.1.34"
static_init = "1.0.4"
compio = { path = "../../fork/compio/compio", features = [
  "macros",
  "net",
  "time",
] }
compio-net = { path = "../../fork/compio/compio-net", features = [
  "extern_resolve",
] }

[dev-dependencies.tokio]
version = "1.48.0"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]
