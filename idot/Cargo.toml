[package]
name = "idot"
version = "0.1.1"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-dns/rust.git"
homepage = "https://github.com/js0-dns/rust/tree/main/idot"
description = "DNS over TLS (DoT) client / DNS over TLS (DoT) 客户端"
keywords = [ "dns", "tls", "dot", "resolver" ]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ "static" ]
static = [ "dep:static_init" ]

[dependencies]
bytes = "1.11.0"
smol_str = "0.3.4"
thiserror = "2.0.17"
webpki-roots = "1.0.4"
tokio-rustls = "0.26"

[dependencies.static_init]
version = "1.0.4"
optional = true
features = [ "parking_lot" ]

[dependencies.dns_parse]
version = "0.1.2"
path = "../dns_parse"

[dependencies.idns]
version = "0.2.13"
path = "../idns"

[dependencies.rustls]
version = "0.23.35"
features = [ "ring" ]

[dependencies.tokio]
version = "1.48.0"
features = [ "io-util", "net", "sync", "time" ]

[dev-dependencies]
aok = "0.1.18"
log = "0.4.29"
log_init = "0.1.34"

[dev-dependencies.static_init]
version = "1.0.4"
features = [ "parking_lot" ]

[dev-dependencies.idns]
version = "0.2.13"
path = "../idns"
features = [ "mx", "cache" ]

[dev-dependencies.tokio]
version = "1.48.0"
features = [ "macros", "rt", "rt-multi-thread", "time", "sync" ]
