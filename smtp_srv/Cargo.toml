[package]
name = "smtp_srv"
version = "0.2.11"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/smtp_srv"
description = "Auto-refreshing SMTPS server powered by Redis / Kvrocks / 基于 Redis / Kvrocks 自动热更新证书的 SMTPS 服务器"
keywords = [ "smtp", "kvrocks", "certificate", "email", "server" ]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ ]

[dependencies]
aok = "0.1.18"
genv = "0.1.18"
log = "0.4.29"
rustls = "0.23.35"
static_init = "1.0.4"
xboot = "0.1.29"

[dependencies.log_init]
version = "0.1.32"
features = [ "systemd" ]

[dependencies.smtp_send]
version = "0.1.18"
path = "../smtp_send"

[dependencies.mimalloc]
version = "0.1.48"
features = [ "v3" ]

[dependencies.mail_struct]
version = "0.1.18"
path = "../mail_struct"
features = [ "encode" ]

[dependencies.auth_env]
version = "0.1.4"
path = "../auth_env"

[dependencies.cert_by_host]
version = "0.1.6"
path = "../cert_by_host"

[dependencies.smtp_recv]
version = "0.1.33"
path = "../smtp_recv"

[dependencies.ssl_trait]
version = "0.1.3"
path = "../ssl_trait"

[dependencies.tokio]
version = "1.48.0"
features = [ "rt-multi-thread" ]
