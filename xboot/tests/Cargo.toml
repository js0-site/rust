[package]
name = "xboot_demo"
version = "0.1.0"
edition = "2024"
categories = [
  "development-tools::testing",
  "development-tools",
  "asynchronous",
  "concurrency",
  "rust-patterns",
]

[package.metadata.cargo-machete]
ignored = ["linkme"]

[dependencies]
linkme = "0.3.35"
log = "0.4.29"
log_init = { version = "0.1.34", path = "../../log_init" }

[dependencies.aok]
version = "0.1.18"

[dependencies.tokio]
version = "1.48.0"
features = ["macros", "rt", "rt-multi-thread", "time"]
