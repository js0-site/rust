[package]
name = "set_timer"
version = "0.1.3"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/set_timer"
description = "Robust interval execution for Rust, supporting async and sync closures. / Rust 健壮的定时间隔执行库，支持异步和同步闭包。"
keywords = ["interval", "timer", "tokio", "async", "schedule"]

[features]
default = []
async = []
sync = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { version = "1.48.0", features = ["rt", "time"] }


[dev-dependencies]
aok = "0.1.18"
log = "0.4.28"
log_init = "0.1.28"
static_init = "1.0.4"

[dev-dependencies.tokio]
version = "1.48.0"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]