[package]
name = "forking"
version = "0.1.6"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/forking"
description = "forking"
keywords = []
categories = ["os", "os::unix-apis", "development-tools", "concurrency", "asynchronous"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
libc = "0.2"
log = "0.4.34"
thiserror = "2.0.20"

[dev-dependencies]
aok = "0.1.18"
log = "0.4.34"
log_init = "0.1.39"
static_init = { version = "1.0.4", features = ["parking_lot"] }

[dev-dependencies.tokio]
version = "1.53.1"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]
