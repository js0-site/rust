[package]
name = "socket_port"
version = "0.1.7"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0/rust.git"
homepage = "https://github.com/js0/rust/tree/main/socket_port"
description = "Minimalist dual-stack TCP listener / 极简双栈 TCP 监听器"
keywords = ["tcp", "socket", "ipv6", "network", "server"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
kill_port = { version = "0.1.2", optional = true }
socket2 = { version = "0.6.1", features = ["all"] }

[dev-dependencies]
aok = "0.1.18"
log = "0.4.29"
log_init = "0.1.32"
static_init = "1.0.4"

[dev-dependencies.tokio]
version = "1.48.0"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]
