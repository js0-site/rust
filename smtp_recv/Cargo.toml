[package]
name = "smtp_recv"
version = "0.1.33"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/smtp_recv"
description = "Secure SMTP server with Implicit TLS and SNI support / 支持隐式 TLS 和 SNI 的安全 SMTP 服务器"
keywords = ["smtp", "server", "tls", "async", "email"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

[dependencies]
anyhow = "1.0.100"
aok = "0.1.18"
base64 = "0.22.1"
email_address = "0.2.9"
log = "0.4.29"
reload_self = "0.1.14"
restart_signal = "0.1.6"

thiserror = "2.0.17"
tokio-rustls = "0.26.4"
xboot = "0.1.29"
xmail = "0.1.16"

[dependencies.parking_lot]
version = "0.12.5"
features = ["send_guard"]

[dependencies.socket_port]
version = "0.1.7"
path = "../socket_port"

[dependencies.mail_struct]
version = "0.1.18"
path = "../mail_struct"

[dependencies.ssl_trait]
version = "0.1.3"
path = "../ssl_trait"

[dependencies.rustls]
version = "0.23.35"
features = ["ring"]

[dependencies.auth_trait]
version = "0.1.6"
path = "../auth_trait"

[dependencies.tokio]
version = "1.48.0"
features = ["macros", "rt", "rt-multi-thread", "time", "sync", "full"]

[dev-dependencies]
mail-parser = "0.11.1"
aok = "0.1.18"
log_init = "0.1.32"
serde_yaml_bw = "2.5.1"
static_init = "1.0.4"
webpki-roots = "1.0.4"

[dev-dependencies.cert_by_host]
path = "../cert_by_host"
version = "0.1.6"

[dev-dependencies.serde]
version = "1.0"
features = ["derive"]

[dev-dependencies.lettre]
version = "0.11.19"
features = [
  "tokio1",
  "rustls-tls",
  "builder",
  "tokio1-rustls-tls",
  "smtp-transport",
]
default-features = false

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.4.5"
