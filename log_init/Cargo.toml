[package]
name = "log_init"
version = "0.1.34"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/dev/log_init"
description = "Smart logging initialization with automatic backend detection / 智能日志初始化与自动后端检测"
keywords = [
  "logging",
  "systemd",
  "journald",
  "initialization",
  "cross-platform",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["stdout"]
stdout = []
systemd = ["dep:logforth-append-journald"]

[dependencies]
coarsetime = "0.1.36"
colored = "3.0.0"
jiff = "0.2.17"
static_init = { version = "1.0.4", features = ["parking_lot"] }

[dependencies.log]
version = "0.4.29"
features = ["kv"]

[dependencies.logforth]
version = "0.29.1"
features = ["starter-log"]

[dev-dependencies]
aok = "0.1.18"

[target.'cfg(target_os = "linux")'.dependencies]
logforth-append-journald = { version = "0.3.0", optional = true }

