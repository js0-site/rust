[package]
name = "idoh"
version = "0.2.7"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/dev/idoh"
description = "Async DoH client for Rust / Rust 异步 DoH 客户端"
keywords = [ "dns", "doh", "async", "resolver", "https" ]
categories = ["network-programming", "asynchronous", "web-programming", "api-bindings", "development-tools"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ ]
static = [ "dep:static_init" ]

[dependencies]
log = "0.4.29"
serde_json = "1"
thiserror = "2"

[dependencies.serde]
version = "1"
features = [ "derive" ]

[dependencies.idns]
version = "0.2.13"
path = "../idns"

[dependencies.ireq]
version = "0.1.33"
path = "../ireq"
features = [ "proxy" ]

[dependencies.static_init]
version = "1.0.4"
optional = true
features = [ "parking_lot" ]

[dependencies.tokio]
version = "1.49.0"
features = [ "time", "net", "rt" ]

[dev-dependencies]
aok = "0.1.18"
log_init = "0.1.34"
futures = "0.3"
tabled = "0.20"

[dev-dependencies.static_init]
version = "1.0.4"
features = [ "parking_lot" ]

[dev-dependencies.idns]
version = "0.2.13"
path = "../idns"
features = [ "mx" ]

[dev-dependencies.tokio]
version = "1.49.0"
features = [ "test-util", "macros" ]
