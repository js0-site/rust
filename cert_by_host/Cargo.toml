[package]
name = "cert_by_host"
version = "0.1.6"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/cert_by_host"
description = "Dynamic SSL certificate loading from Kvrocks with auto-expiration / 基于 Kvrocks 的动态 SSL 证书加载与自动过期管理"
keywords = [ "ssl", "certificate", "kvrocks", "cache", "rustls" ]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[package.metadata.cargo-machete]
ignored = [ "linkme" ]

[features]
default = [ ]

[dependencies]
anyhow = "1.0.100"
coarsetime = "0.1.36"
dashmap = "6.1.0"
fred = "10.1.0"
linkme = "0.3.35"
parking_lot = "0.12.5"
rustls-pemfile = "2.2.0"
sonic-rs = "0.5.6"
static_init = "1.0.4"
thiserror = "2.0.17"
x509-parser = "0.18.0"
xboot = "0.1.29"

[dependencies.ssl_trait]
version = "0.1.3"
path = "../ssl_trait"

[dependencies.tokio]
version = "1.48.0"
features = [ "time" ]

[dependencies.expire_set]
version = "0.1.7"
path = "../expire_set"

[dependencies.xkv]
version = "0.1.51"
features = [ "r" ]

[dev-dependencies]
aok = "0.1.18"
log = "0.4.29"
log_init = "0.1.28"
static_init = "1.0.4"
xboot = "0.1.29"

[dev-dependencies.tokio]
version = "1.48.0"
features = [ "macros", "rt", "rt-multi-thread", "time", "sync" ]