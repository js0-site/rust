[package]
name = "idpath"
version = "0.1.1"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/idpath"
description = "Hierarchical path encoding for scalable storage systems / 为可扩展存储系统设计的层次化路径编码"
keywords = ["path", "id", "base32", "storage", "load-balancing"]
categories = ["data-structures", "encoding", "development-tools", "filesystem", "algorithms"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
fast32 = "1.0.3"
hipstr = "0.8.0"

[dev-dependencies]
aok = "0.1.18"
log = "0.4.33"
log_init = "0.1.38"
static_init = "1.0.4"

[dev-dependencies.tokio]
version = "1.52.3"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]
