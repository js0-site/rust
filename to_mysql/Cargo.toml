[package]
name = "to_mysql"
version = "0.1.7"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/to_mysql"
description = "Efficient MySQL SQL Generation / 高效 MySQL SQL 生成"
keywords = [ "mysql", "sql", "generation", "struct", "orm" ]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ ]

[dependencies.sqle]
version = "0.1.4"
path = "../sqle"
features = [ "mysql" ]

[dependencies.vb]
version = "0.2.5"
path = "../vb"

[dependencies.kind2sql]
path = "../kind2sql"
version = "0.1.18"
features = [ "sql_field" ]

[dev-dependencies]
aok = "0.1.18"
log = "0.4.29"
log_init = "0.1.28"
static_init = "1.0.4"

[dev-dependencies.tosql]
path = "../tosql"
version = "0.1.16"

[dev-dependencies.tokio]
version = "1.48.0"
features = [ "macros", "rt", "rt-multi-thread", "time", "sync" ]
