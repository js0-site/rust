[package]
name = "ipbin"
version = "0.1.1"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/ipbin"
description = "Seamless IP Address to Binary Conversion / IP地址到二进制的无缝转换"
keywords = ["ip", "binary", "bytes", "conversion", "network"]
categories = ["network-programming", "data-structures", "encoding", "development-tools", "no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

[dev-dependencies]
aok = "0.1.18"
log = "0.4.29"
log_init = "0.1.34"
static_init = { version = "1.0.4", features = ["parking_lot"] }
