[package]
authors = ["jssite@googlegroups.com"]
categories = ["algorithms", "data-structures", "compression", "database", "no-std"]
description = "Ultra-fast Xor and Binary Fuse filters for Rust / 极致性能的 Rust Xor 与 Binary Fuse 过滤器"
edition = "2024"
homepage = "https://github.com/js0-site/rust/tree/main/jdb_xorf"
keywords = ["xor", "filter", "hash", "hashing", "fuse"]
license = "MIT"
name = "jdb_xorf"
readme = "README.md"
repository = "https://github.com/js0-site/rust"
version = "0.13.14"

[dependencies]
libm = { version = "0.2.16" }
bitcode = { version = "0.6", optional = true }
thiserror = { version = "2.0.20", default-features = false }
gxhash = { version = "3.5.0", default-features = false, features = ["std"], optional = true }
museair = { version = "0.6.0", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.8.2"
criterion-macro = "0.4.0"
rand = "0.10"
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats"] }
tikv-jemallocator = "0.7.0"
xorf = "0.13.0"

[[bench]]
name = "bench"
harness = false

[features]
default = ["uniform-random", "gxhash"]
uniform-random = []
bitcode = ["dep:bitcode"]
# Toolchain flags (declared so cfg(feature = "...") is expected)
# 工具链开关（声明以使 cfg(feature = "...") 被识别）
nightly = []
docsrs = []

# Benchmark features
# 评测特性
bench-jdb = ["bitcode"]
bench-xorf = []
bench-all = ["bench-jdb", "bench-xorf"]
museair = ["dep:museair"]
gxhash = ["dep:gxhash"]