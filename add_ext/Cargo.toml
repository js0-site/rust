[package]
name = "add_ext"
version = "0.1.2"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0/rust.git"
homepage = "https://github.com/js0/rust/tree/main/add_ext"
description = "Append extensions to file paths / 为文件路径追加扩展名"
keywords = [ "filesystem", "path", "extension", "utility", "rust" ]
categories = [
"filesystem",
"command-line-utilities",
"development-tools",
"value-formatting",
"no-std"
]
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ ]

[dev-dependencies]
aok = "0.1.18"
log = "0.4.29"
log_init = "0.1.34"
static_init = "1.0.4"