[package]
name = "smtp_send"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/smtp_send"
description = "smtp_send"
keywords = [ ]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ ]
jiff = [ "dep:jiff" ]

[dependencies]
aok = "0.1.18"
bitcode = "0.6.7"
bytes = "1.11.0"
bytes-utils = "0.1.4"
dashmap = "6.1.0"
fred = "10.1.0"
genv = "0.1.18"
intbin = "0.2.3"
log = "0.4.29"
log_init = "0.1.28"
mail-send = "0.5.2"
static_init = "1.0.4"
thiserror = "2.0.17"
xboot = "0.1.29"
xerr = "0.1.16"

[dependencies.expire_cache]
version = "0.1.9"
path = "../expire_cache"
features = [ "dashmap" ]

[dependencies.sk_dkim]
version = "0.1.5"
path = "../sk_dkim"

[dependencies.rustls]
version = "0.23.35"
features = [ "ring" ]

[dependencies.cert_by_host]
version = "0.1.5"
path = "../cert_by_host"

[dependencies.host]
version = "0.1.2"
path = "../host"

[dependencies.idoh]
version = "0.1.12"
path = "../idoh"
features = [ "mx", "cache" ]

[dependencies.jiff]
version = "0.2.16"
optional = true

[dependencies.mail_struct]
version = "0.1.9"
path = "../mail_struct"
features = [ "decode", "send" ]

[dependencies.mimalloc]
version = "0.1.48"
features = [ "v3" ]

[dependencies.msgq]
version = "0.1.11"
path = "../msgq"

[dependencies.tokio]
version = "1.48.0"
features = [ "rt-multi-thread" ]

[dependencies.xkv]
version = "0.1.51"
features = [ "r" ]

[dev-dependencies]
aok = "0.1.18"
log = "0.4.29"
log_init = "0.1.28"
static_init = "1.0.4"

[dev-dependencies.tokio]
version = "1.48.0"
features = [ "macros", "rt", "rt-multi-thread", "time", "sync" ]
