[package]
name = "tosql_linkme"
version = "0.2.4"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/tosql_linkme"
description = "tosql_linkme"
keywords = []
categories = ["development-tools", "database", "parsing", "algorithms", "data-structures"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
off = []
default = []

[dev-dependencies]
aok = "0.1.18"
log = "0.4.30"
log_init = "0.1.34"
static_init = { version = "1.0.4", features = ["parking_lot"] }

[dev-dependencies.tokio]
version = "1.52.3"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]
