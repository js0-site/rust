[package]
name = "host"
version = "0.1.2"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/host"
description = "host"
keywords = []
categories = ["os", "development-tools", "network-programming", "asynchronous", "no-std"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
global_str = { version = "0.1.3", path = "../global_str" }
hostname = "0.4.2"
static_init = { version = "1.0.4", features = ["parking_lot"] }

[dev-dependencies]
aok = "0.1.18"
log = "0.4.30"
log_init = "0.1.34"
static_init = { version = "1.0.4", features = ["parking_lot"] }

[dev-dependencies.tokio]
version = "1.52.3"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]
