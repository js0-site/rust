[package]
name = "cpu_load"
version = "0.1.8"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/cpu_load"
description = "Real-time CPU load monitoring with intelligent core selection / 实时 CPU 负载监控与智能核心选择"
keywords = ["cpu", "monitoring", "load-balancing", "async", "compio"]
categories = ["development-tools::profiling", "os::unix-apis", "asynchronous"]
readme = "README.md"

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
compio = { version = "0.19.1", features = ["time"] }
defer-lite = "1.0.0"
static_init = "1.0.4"
sysinfo = "0.39.5"

[dev-dependencies]
aok = "0.1.18"
compio = { version = "0.19.1", features = ["macros"] }
log = "0.4.33"
log_init = "0.1.38"
static_init = "1.0.4"
