[package]
name = "expire_set"
version = "0.1.5"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/expire_set"
description = "High-performance concurrent expiration set using unsafe raw pointers / 基于非安全原始指针的高性能并发过期集合"
keywords = ["cache", "expire", "unsafe", "concurrency", "performance"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
dashmap = "6.1.0"
tokio = { version = "1.48.0", features = ["time", "rt"] }

[dev-dependencies]
aok = "0.1.18"
log = "0.4.28"
log_init = "0.1.28"
static_init = "1.0.4"

[dev-dependencies.tokio]
version = "1.48.0"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]