[package]
name = "kind2sql"
version = "0.1.18"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/kind2sql"
description = "Convert binary streams to SQL values / 将二进制流转换为SQL值"
keywords = ["sql", "binary", "converter", "mysql", "schema"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
sql_field = []
mysql = []

[dependencies]
bytes = "1.11.0"
num_enum = "0.7"

[dependencies.sqle]
version = "0.1.4"
path = "../sqle"

[dependencies.vb]
version = "0.2.5"
path = "../vb"

[dev-dependencies]
aok = "0.1.18"
log = "0.4.29"
log_init = "0.1.34"
static_init = { version = "1.0.4", features = ["parking_lot"] }

[dev-dependencies.tokio]
version = "1.48.0"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]
