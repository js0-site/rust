[package]
name = "expire_cache"
version = "0.1.0"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/expire_cache"
description = "expire_cache"
keywords = []

[features]
default = []
dashmap = ["dep:dashmap"]
dashset = ["dep:dashmap"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
boxleak = "0.1.2"
dashmap = { version = "6.1.0", optional = true }
sendptr = { version = "0.1.2", path = "../sendptr" }
set_timer = { version = "0.1.3", path = "../set_timer", features = ["sync"] }
ts_ = { version = "0.1.1", path = "../ts_", features = ["sec"] }

[dev-dependencies]
aok = "0.1.18"
log = "0.4.28"
log_init = "0.1.28"
static_init = "1.0.4"

[dev-dependencies.tokio]
version = "1.48.0"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]
