[package]
name = "xkv_demo"
version = "0.1.0"
edition = "2024"
categories = ["development-tools::testing", "database", "asynchronous", "concurrency", "development-tools"]

[package.metadata.cargo-machete]
ignored = ["linkme"]

[dependencies]
linkme = "0.3.35"
log = "0.4"

[dependencies.static_]
version = "0.1.21"

[dependencies.tokio]
version = "1.49.0"
features = ["macros", "rt", "rt-multi-thread", "time"]

[dependencies.xkv]
version = "0.1.51"
path = ".."
features = ["r"]

[dependencies.aok]
version = "0.1.18"
