[dependencies]
aok = "0.1.18"

[dependencies.rand]
version = "0.9.2"
optional = true

[package]
name = "citer"
version = "0.1.16"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/citer"
description = "citer"
categories = ["data-structures", "algorithms", "development-tools", "no-std", "rust-patterns"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
aok = "0.1.18"
log = "0.4.29"
static_init = { version = "1.0.4", features = ["parking_lot"] }

[dev-dependencies.log_init]
path = "../log_init"
version = "0.1.34"

[features]
default = []
rand = ["dep:rand"]