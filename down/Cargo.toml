[package]
name = "down"
version = "0.1.5"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/dev/down"
description = "Multi-source parallel download with automatic failover / 多源并行下载与自动故障转移"
keywords = [ "download", "parallel", "mirror", "failover", "async" ]
categories = ["network-programming", "asynchronous", "web-programming", "development-tools", "concurrency"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]

[features]
default = [ ]

[dependencies]
bytes = "1.11.1"
coarsetime = "0.1.37"
crossfire = "2.1.10"
indexmap = "2"
log = "0.4.29"
parking_lot = "0.12.5"
thiserror = "2.0.18"
xerr = "0.1.16"

[dependencies.ireq]
version = "0.1.33"
features = [ "proxy" ]

[dependencies.tokio]
version = "1.49.0"
features = [ "macros", "rt", "rt-multi-thread", "time", "sync" ]

[dev-dependencies]
aok = "0.1.18"
static_init = { version = "1.0.4", features = ["parking_lot"] }

[dev-dependencies.log_init]
path = "../log_init"
version = "0.1.34"
