[package]
name = "down"
version = "0.1.5"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/dev/down"
description = "Multi-source parallel download with automatic failover / 多源并行下载与自动故障转移"
keywords = ["download", "parallel", "mirror", "failover", "async"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []

[dependencies]
bytes = "1.11.0"
coarsetime = "0.1.36"
crossfire = "2.1.8"
indexmap = "2"
parking_lot = "0.12.5"
thiserror = "2.0.17"
tracing = "0.1.43"
xerr = "0.1.16"

[dependencies.ireq]
version = "0.1.32"

features = ["proxy"]

[dependencies.tokio]
version = "1.48.0"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]

[dev-dependencies]
aok = "0.1.18"
loginit = "0.1.18"
static_init = "1.0.4"