[package]
name = "msgq"
version = "0.1.8"
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/js0-site/rust.git"
homepage = "https://github.com/js0-site/rust/tree/main/msgq"
description = "Robust Redis Stream based message queue with auto-claim and retry handling / 基于 Redis Stream 的健壮消息队列，支持自动认领和重试处理"
keywords = ["redis", "stream", "queue", "async", "consumer"]

[features]
default = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
aok = "0.1.18"
bytes = "1.11.0"
bytes-utils = "0.1.4"
fred = "10.1.0"
log = "0.4.28"
tokio = { version = "1.48.0", features = ["time"] }
xerr = "0.1.16"
xkv = { version = "0.1.51", features = ["r"] }

[dev-dependencies]
aok = "0.1.18"
log = "0.4.28"
log_init = "0.1.28"
static_init = "1.0.4"
xboot = "0.1.29"

[dev-dependencies.tokio]
version = "1.48.0"
features = ["macros", "rt", "rt-multi-thread", "time", "sync"]
